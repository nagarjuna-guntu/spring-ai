spring:
  application:
    name: tool-search-tool-lucene-tool-index

spring.threads:
  virtual:
    enabled: true

spring.main:
  banner-mode: off
  web-application-type: none
  keep-alive: true # Prevents the JVM from shutting down when only virtual threads are running

spring.ai:
  model.embedding: none # disable the embedding model autoconfiguration
  ollama:
    base-url: http://localhost:11434
    chat.options.model: llama3.2
    init.pull-model-strategy: when_missing
  chat.client:
    tool-search-advisor:
      enabled: true
      tool-index-type: lucene
      reference-tool-name-accumulation: false # When true, accumulate tool names across all search turns; when false, keep only the most recent turn (all parallel calls within it included).
      lucene:
        min-score-threshold: 0.4

