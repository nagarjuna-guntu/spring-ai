spring:
  application:
    name: modular-rag

spring.threads:
  virtual:
    enabled: true

spring.main:
  keep-alive: true # Prevents the JVM from shutting down when only virtual threads are running

server:
  port: 3001

spring.ai:
  ollama:
    base-url: http://localhost:11434
    chat.options.model: llama3.2
    embedding.options.model: nomic-embed-text-v2-moe
    init.pull-model-strategy: when_missing
  vectorstore:
    qdrant:
      host: localhost
      port: 6334
      initialize-schema: true
      collection-name: game-rules
  typesafe:
    base-url: http://localhost:11434
    model: tev1:0.8b
    api-key: local

logging.level:
  org.springframework.ai: DEBUG

